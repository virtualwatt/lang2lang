# Горячие клавиши для преобразования к целевому языку
hotkeys:
  ru: "super+alt+r"    # преобразовать выделение к русскому
  ua: "super+alt+u"    # преобразовать выделение к украинскому
  en: "super+alt+e"    # преобразовать выделение к английскому

# Необязательная горячая клавиша для отмены последнего преобразования
undo: "super+alt+u"
